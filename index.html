<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gestionale completo per tabaccheria: cassa, magazzino, gratta e vinci, clienti, prima nota e report.">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tabaccheria Antonio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ============================================================
   GESTIONALE TABACCHERIA — Design system in stile iOS
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#F2F2F7;
  --bg-2:#FFFFFF;
  --bg-3:#FFFFFF;
  --bg-sidebar:rgba(242,242,247,.72);
  --bar:rgba(249,249,251,.80);
  --fill-1:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.18);
  --fill-3:rgba(118,118,128,.06);
  --sep:rgba(60,60,67,.16);
  --sep-2:rgba(60,60,67,.29);
  --txt:#000000;
  --txt-2:rgba(60,60,67,.62);
  --txt-3:rgba(60,60,67,.34);
  --blue:#007AFF;   --blue-soft:rgba(0,122,255,.12);
  --green:#34C759;  --green-soft:rgba(52,199,89,.14);
  --red:#FF3B30;    --red-soft:rgba(255,59,48,.12);
  --orange:#FF9500; --orange-soft:rgba(255,149,0,.14);
  --yellow:#FFCC00; --purple:#AF52DE; --pink:#FF2D55;
  --indigo:#5856D6; --teal:#30B0C7;   --mint:#00C7BE;
  --brown:#A2845E;  --gray:#8E8E93;
  --shadow-1:0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
  --shadow-2:0 4px 16px -6px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.06);
  --shadow-3:0 24px 60px -18px rgba(0,0,0,.28), 0 2px 8px rgba(0,0,0,.08);
  --r-card:16px; --r-btn:12px; --r-pill:980px;
  --spring:cubic-bezier(.32,.72,0,1);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Roboto Mono",monospace;
  --sidebar-w:264px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
    --bg-sidebar:rgba(28,28,30,.72);
    --bar:rgba(28,28,30,.76);
    --fill-1:rgba(120,120,128,.26); --fill-2:rgba(120,120,128,.36); --fill-3:rgba(118,118,128,.16);
    --sep:rgba(84,84,88,.50); --sep-2:rgba(84,84,88,.72);
    --txt:#FFFFFF; --txt-2:rgba(235,235,245,.62); --txt-3:rgba(235,235,245,.32);
    --blue:#0A84FF;   --blue-soft:rgba(10,132,255,.22);
    --green:#30D158;  --green-soft:rgba(48,209,88,.20);
    --red:#FF453A;    --red-soft:rgba(255,69,58,.20);
    --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.20);
    --yellow:#FFD60A; --purple:#BF5AF2; --pink:#FF375F;
    --indigo:#5E5CE6; --teal:#40C8E0;   --mint:#63E6E2;
    --brown:#AC8E68;  --gray:#98989D;
    --shadow-1:0 1px 2px rgba(0,0,0,.6);
    --shadow-2:0 4px 16px -6px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.5);
    --shadow-3:0 24px 60px -18px rgba(0,0,0,.85), 0 2px 8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#000000; --bg-2:#1C1C1E; --bg-3:#2C2C2E;
  --bg-sidebar:rgba(28,28,30,.72);
  --bar:rgba(28,28,30,.76);
  --fill-1:rgba(120,120,128,.26); --fill-2:rgba(120,120,128,.36); --fill-3:rgba(118,118,128,.16);
  --sep:rgba(84,84,88,.50); --sep-2:rgba(84,84,88,.72);
  --txt:#FFFFFF; --txt-2:rgba(235,235,245,.62); --txt-3:rgba(235,235,245,.32);
  --blue:#0A84FF;   --blue-soft:rgba(10,132,255,.22);
  --green:#30D158;  --green-soft:rgba(48,209,88,.20);
  --red:#FF453A;    --red-soft:rgba(255,69,58,.20);
  --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.20);
  --yellow:#FFD60A; --purple:#BF5AF2; --pink:#FF375F;
  --indigo:#5E5CE6; --teal:#40C8E0;   --mint:#63E6E2;
  --brown:#AC8E68;  --gray:#98989D;
  --shadow-1:0 1px 2px rgba(0,0,0,.6);
  --shadow-2:0 4px 16px -6px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.5);
  --shadow-3:0 24px 60px -18px rgba(0,0,0,.85), 0 2px 8px rgba(0,0,0,.6);
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--txt);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
h1,h2,h3,h4,p,figure{margin:0;}
button,input,select,textarea{font:inherit;color:inherit;}
button{background:none;border:0;padding:0;cursor:pointer;}
a{color:var(--blue);text-decoration:none;}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:6px;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--fill-2);border-radius:99px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}

/* ---------- SHELL ---------- */
.app{display:flex;height:100dvh;overflow:hidden;}

/* ---------- SIDEBAR (iPadOS split view) ---------- */
.sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);display:none;flex-direction:column;
  background:var(--bg-sidebar);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-right:1px solid var(--sep);padding:14px 12px 12px;gap:2px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:11px;padding:8px 10px 16px;}
.tmark{
  width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(180deg,#3A3A3C,#0E0E10);color:#fff;
  font-weight:800;font-size:22px;line-height:1;letter-spacing:-.02em;
  box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18);
}
.brand-txt{min-width:0;}
.brand-txt b{display:block;font-size:15px;font-weight:650;letter-spacing:-.01em;line-height:1.2;}
.brand-txt span{display:block;font-size:12.5px;color:var(--txt-2);line-height:1.3;}
.nav-label{
  font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;
  color:var(--txt-3);padding:14px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;padding:8px 11px;border-radius:10px;
  font-size:15px;font-weight:500;letter-spacing:-.01em;color:var(--txt);text-align:left;
  transition:background .15s ease;
}
.nav-item .ic{width:22px;height:22px;flex:0 0 22px;color:var(--blue);}
.nav-item:hover{background:var(--fill-3);}
.nav-item[aria-current="page"]{background:var(--blue);color:#fff;font-weight:600;}
.nav-item[aria-current="page"] .ic{color:#fff;}
.nav-item .badge{margin-left:auto;}
.badge{
  min-width:20px;padding:1px 7px;border-radius:99px;background:var(--red);color:#fff;
  font-size:12px;font-weight:650;text-align:center;line-height:18px;
}
.nav-item[aria-current="page"] .badge{background:rgba(255,255,255,.28);}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 120px;}
@media(min-width:1000px){ .wrap{padding-bottom:48px;} }

/* ---------- NAV BAR ---------- */
.navbar{
  position:sticky;top:0;z-index:40;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid transparent;transition:border-color .25s ease;
}
.navbar.stuck{border-bottom-color:var(--sep);}
.navbar-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px;min-height:52px;}
.navbar-title{
  font-size:17px;font-weight:650;letter-spacing:-.02em;flex:1;min-width:0;
  opacity:0;transform:translateY(6px);transition:opacity .22s ease,transform .22s ease;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.navbar.stuck .navbar-title{opacity:1;transform:none;}
.navbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.largetitle{padding:6px 0 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.largetitle h1{font-size:clamp(28px,4.4vw,34px);font-weight:750;letter-spacing:-.035em;line-height:1.1;text-wrap:balance;}
.largetitle .sub{font-size:14.5px;color:var(--txt-2);margin-top:3px;letter-spacing:-.01em;}

/* ---------- BUTTONS ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:var(--r-btn);font-size:15px;font-weight:600;letter-spacing:-.01em;
  background:var(--fill-1);color:var(--txt);white-space:nowrap;
  transition:transform .14s var(--spring),background .16s ease,opacity .16s ease;
}
.btn .ic{width:18px;height:18px;flex:0 0 18px;}
.btn:active{transform:scale(.955);}
.btn:hover{background:var(--fill-2);}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue);filter:brightness(1.07);}
.btn-green{background:var(--green);color:#fff;}
.btn-green:hover{filter:brightness(1.07);background:var(--green);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-danger:hover{background:var(--red-soft);filter:brightness(1.05);}
.btn-tint{background:var(--blue-soft);color:var(--blue);}
.btn-tint:hover{background:var(--blue-soft);filter:brightness(1.05);}
.btn-plain{background:none;color:var(--blue);padding:8px 6px;}
.btn-plain:hover{background:var(--fill-3);}
.btn-lg{padding:14px 22px;font-size:16.5px;border-radius:14px;}
.btn-block{width:100%;}
.btn-icon{width:34px;height:34px;padding:0;border-radius:50%;background:var(--fill-1);color:var(--blue);flex:0 0 34px;}
.btn-icon .ic{width:19px;height:19px;}
.btn:disabled{opacity:.4;pointer-events:none;}

/* ---------- CARDS & LISTS ---------- */
.card{background:var(--bg-2);border-radius:var(--r-card);box-shadow:var(--shadow-1);overflow:hidden;}
.card-pad{padding:18px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px 11px;}
.card-head h2{font-size:16.5px;font-weight:650;letter-spacing:-.02em;}
.card-head .hint{font-size:13px;color:var(--txt-2);font-weight:450;}
.section-label{
  font-size:12.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-2);
  padding:26px 4px 8px;
}
.grid{display:grid;gap:14px;}
.list{list-style:none;margin:0;padding:0;background:var(--bg-2);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--shadow-1);}
.row{
  display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;
  border-bottom:1px solid var(--sep);position:relative;background:none;
  transition:background .12s ease,transform .14s var(--spring);
}
.list > *:last-child .row, .row:last-child{border-bottom:0;}
button.row:hover,.row.tappable:hover{background:var(--fill-3);}
button.row:active,.row.tappable:active{transform:scale(.988);background:var(--fill-1);}
.row-main{flex:1;min-width:0;display:block;}
.row-title{display:block;font-size:15.5px;font-weight:550;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-sub{display:block;font-size:13px;color:var(--txt-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-val{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em;text-align:right;white-space:nowrap;}
.row-val small{display:block;font-size:12.5px;font-weight:450;color:var(--txt-2);}
.chev{width:16px;height:16px;color:var(--txt-3);flex:0 0 16px;}
.avatar{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;color:#fff;
  font-weight:650;font-size:14px;letter-spacing:-.02em;
}
.avatar .ic{width:20px;height:20px;}
.empty{padding:44px 22px;text-align:center;color:var(--txt-2);}
.empty .ic{width:36px;height:36px;color:var(--txt-3);margin-bottom:10px;}
.empty b{display:block;font-size:16px;font-weight:600;color:var(--txt);margin-bottom:4px;letter-spacing:-.01em;}
.empty p{font-size:14px;max-width:32ch;margin:0 auto;}

/* ---------- PILLS / TAGS ---------- */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:12.5px;font-weight:600;letter-spacing:-.005em;background:var(--fill-1);color:var(--txt-2);white-space:nowrap;
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill-green{background:var(--green-soft);color:var(--green);}
.pill-red{background:var(--red-soft);color:var(--red);}
.pill-orange{background:var(--orange-soft);color:var(--orange);}
.pill-blue{background:var(--blue-soft);color:var(--blue);}

/* ---------- SEGMENTED CONTROL ---------- */
.seg{
  display:inline-flex;position:relative;background:var(--fill-1);border-radius:10px;padding:2px;gap:2px;
  max-width:100%;overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none;}
.seg button{
  position:relative;z-index:1;padding:6px 14px;border-radius:8px;font-size:13.5px;font-weight:550;
  letter-spacing:-.01em;color:var(--txt);white-space:nowrap;transition:color .18s ease,font-weight .18s ease;
}
.seg button[aria-selected="true"]{
  background:var(--bg-2);font-weight:650;box-shadow:0 1px 3px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.04);
}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  padding:7px 14px;border-radius:99px;background:var(--bg-2);box-shadow:var(--shadow-1);
  font-size:13.5px;font-weight:550;letter-spacing:-.01em;white-space:nowrap;
  transition:transform .14s var(--spring),background .16s ease,color .16s ease;
}
.chip:active{transform:scale(.94);}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff;font-weight:600;}

/* ---------- FORM ---------- */
.field{display:block;margin-bottom:14px;}
.field > span{display:block;font-size:13px;font-weight:600;color:var(--txt-2);margin-bottom:6px;letter-spacing:-.005em;}
.input,select.input,textarea.input{
  width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--sep-2);
  background:var(--bg-2);font-size:16px;letter-spacing:-.01em;transition:border-color .16s ease,box-shadow .16s ease;
  -webkit-appearance:none;appearance:none;
}
.input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3.5px var(--blue-soft);}
select.input{
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='none' stroke='%238E8E93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 6.5 8 10.5l4-4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:15px;padding-right:34px;
}
textarea.input{resize:vertical;min-height:76px;line-height:1.5;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.search{position:relative;flex:1;min-width:0;}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--txt-3);pointer-events:none;}
.search input{
  width:100%;padding:10px 13px 10px 35px;border-radius:11px;border:0;background:var(--fill-1);
  font-size:16px;letter-spacing:-.01em;
}
.search input:focus{outline:none;box-shadow:0 0 0 3.5px var(--blue-soft);}
.switch{position:relative;width:51px;height:31px;flex:0 0 51px;border-radius:99px;background:var(--fill-2);transition:background .28s var(--spring);}
.switch[aria-checked="true"]{background:var(--green);}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.22);transition:transform .28s var(--spring);
}
.switch[aria-checked="true"]::after{transform:translateX(20px);}

/* ---------- KPI TILES ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px;}
.kpi{background:var(--bg-2);border-radius:var(--r-card);padding:15px 16px 14px;box-shadow:var(--shadow-1);position:relative;overflow:hidden;}
.kpi-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.kpi-ic{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;color:#fff;}
.kpi-ic .ic{width:15px;height:15px;}
.kpi-top span{font-size:12.5px;font-weight:600;color:var(--txt-2);letter-spacing:-.005em;}
.kpi-val{font-size:26px;font-weight:720;letter-spacing:-.04em;line-height:1.05;}
.kpi-val small{font-size:16px;font-weight:650;letter-spacing:-.02em;}
.kpi-foot{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--txt-2);margin-top:6px;font-weight:500;}
.kpi-foot .ic{width:13px;height:13px;}
.up{color:var(--green);} .down{color:var(--red);}

/* ---------- CHARTS ---------- */
.chart{width:100%;display:block;overflow:visible;}
.chart-bar{transition:opacity .16s ease;cursor:pointer;}
.chart-bar:hover{opacity:.72;}
.chart-legend{display:flex;flex-wrap:wrap;gap:12px 18px;padding:4px 18px 18px;}
.leg{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--txt-2);letter-spacing:-.005em;}
.leg i{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}
.leg b{color:var(--txt);font-weight:600;}
.bars{display:flex;flex-direction:column;gap:11px;padding:4px 18px 18px;}
.barline{display:grid;grid-template-columns:118px 1fr 84px;gap:12px;align-items:center;font-size:13.5px;}
.barline .track{height:9px;border-radius:99px;background:var(--fill-1);overflow:hidden;}
.barline .fill{display:block;height:100%;border-radius:99px;transition:width .7s var(--spring);}
.barline .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:520;letter-spacing:-.01em;}
.barline .vl{text-align:right;font-weight:600;letter-spacing:-.01em;}
@media(max-width:520px){ .barline{grid-template-columns:92px 1fr 68px;font-size:12.5px;gap:9px;} }

/* ---------- POS / CASSA ---------- */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 348px;gap:16px;align-items:start;}
.pos > *{min-width:0;}
@media(max-width:940px){ .pos{grid-template-columns:1fr;} }
.pos-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px;}
.ptile{
  background:var(--bg-2);border-radius:14px;padding:11px 12px 10px;text-align:left;box-shadow:var(--shadow-1);
  display:flex;flex-direction:column;gap:5px;min-height:96px;position:relative;overflow:hidden;
  transition:transform .14s var(--spring),box-shadow .16s ease;
}
.ptile::before{content:"";position:absolute;inset:0 auto 0 0;width:3.5px;background:var(--tint,var(--blue));}
.ptile:hover{box-shadow:var(--shadow-2);}
.ptile:active{transform:scale(.955);}
.ptile .nm{padding-right:30px;font-size:13.5px;font-weight:600;letter-spacing:-.015em;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ptile .ct{font-size:11.5px;color:var(--txt-2);font-weight:520;}
.ptile .pr{margin-top:auto;font-size:16.5px;font-weight:700;letter-spacing:-.03em;}
.ptile .st{position:absolute;top:9px;right:9px;font-size:11px;font-weight:650;padding:1px 6px;border-radius:99px;background:var(--fill-1);color:var(--txt-2);}
.ptile .st.low{background:var(--orange-soft);color:var(--orange);}
.ptile .st.out{background:var(--red-soft);color:var(--red);}
.ptile[data-out="1"]{opacity:.52;}

.cart{background:var(--bg-2);border-radius:var(--r-card);box-shadow:var(--shadow-2);position:sticky;top:64px;display:flex;flex-direction:column;max-height:calc(100dvh - 120px);overflow:hidden;}
@media(max-width:940px){ .cart{position:static;max-height:none;} }
.cart-head{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--sep);}
.cart-head h2{font-size:16.5px;font-weight:680;letter-spacing:-.02em;}
.cart-items{overflow-y:auto;flex:1;min-height:74px;}
.citem{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--sep);}
.citem:last-child{border-bottom:0;}
.citem-main{flex:1;min-width:0;}
.citem-main .nm{font-size:14px;font-weight:580;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.citem-main .sb{font-size:12px;color:var(--txt-2);}
.stepper{display:flex;align-items:center;gap:1px;background:var(--fill-1);border-radius:9px;padding:2px;}
.stepper button{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--blue);transition:background .14s ease,transform .12s var(--spring);}
.stepper button:hover{background:var(--fill-2);}
.stepper button:active{transform:scale(.88);}
.stepper button .ic{width:14px;height:14px;}
.stepper .q{min-width:24px;text-align:center;font-size:14px;font-weight:650;}
.citem .amt{font-size:14.5px;font-weight:650;letter-spacing:-.02em;min-width:62px;text-align:right;}
.cart-foot{border-top:1px solid var(--sep);padding:12px 16px 14px;background:var(--fill-3);}
.tot-row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;color:var(--txt-2);padding:3px 0;}
.tot-row b{color:var(--txt);font-weight:600;}
.tot-row.big{font-size:20px;padding:7px 0 11px;color:var(--txt);font-weight:700;letter-spacing:-.03em;}
.tot-row.big b{font-size:27px;font-weight:760;letter-spacing:-.04em;}
.paybtns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px;}
.paybtn{padding:9px 4px;border-radius:11px;background:var(--fill-1);font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .14s var(--spring),background .16s ease;}
.paybtn .ic{width:18px;height:18px;color:var(--txt-2);}
.paybtn:active{transform:scale(.95);}
.paybtn[aria-pressed="true"]{background:var(--blue);color:#fff;}
.paybtn[aria-pressed="true"] .ic{color:#fff;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.keypad button{
  padding:15px 0;border-radius:13px;background:var(--fill-1);font-size:21px;font-weight:550;letter-spacing:-.02em;
  transition:transform .12s var(--spring),background .14s ease;
}
.keypad button:active{transform:scale(.93);background:var(--fill-2);}
.keypad button.act{background:var(--blue-soft);color:var(--blue);font-size:17px;font-weight:650;}
.amount-display{
  text-align:right;font-size:38px;font-weight:730;letter-spacing:-.045em;padding:14px 4px 16px;
  font-variant-numeric:tabular-nums;line-height:1;
}
.amount-display small{display:block;font-size:12.5px;font-weight:600;color:var(--txt-2);letter-spacing:.04em;text-transform:uppercase;margin-bottom:7px;}

/* ---------- TAB BAR (iOS) ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;
  background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-top:1px solid var(--sep);padding:5px 4px calc(5px + env(safe-area-inset-bottom));
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;color:var(--txt-3);
  font-size:10.5px;font-weight:550;letter-spacing:-.005em;transition:color .16s ease,transform .14s var(--spring);
  position:relative;
}
.tab .ic{width:25px;height:25px;}
.tab:active{transform:scale(.9);}
.tab[aria-current="page"]{color:var(--blue);font-weight:620;}
.tab .dotb{position:absolute;top:2px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid var(--bar);}
@media(min-width:1000px){
  .sidebar{display:flex;}
  .tabbar{display:none;}
}

/* ---------- SHEET / MODAL ---------- */
.scrim{
  position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.scrim.open{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:560px;max-height:92dvh;background:var(--bg);border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow-3);
  transform:translateY(100%);transition:transform .42s var(--spring);
}
.scrim.open .sheet{transform:none;}
.sheet-grab{width:38px;height:5px;border-radius:99px;background:var(--fill-2);margin:8px auto 0;flex:0 0 auto;}
.sheet-head{display:flex;align-items:center;gap:12px;padding:10px 16px 12px;border-bottom:1px solid var(--sep);}
.sheet-head h2{flex:1;font-size:17px;font-weight:680;letter-spacing:-.02em;text-align:center;}
.sheet-head .btn-plain{min-width:64px;}
.sheet-head .btn-plain:last-child{text-align:right;justify-content:flex-end;}
.sheet-body{padding:16px;overflow-y:auto;flex:1;}
.sheet-foot{padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--sep);background:var(--bg-2);}
@media(min-width:700px){
  .scrim{align-items:center;padding:24px;}
  .sheet{border-radius:18px;max-height:86dvh;transform:translateY(24px) scale(.96);opacity:0;transition:transform .34s var(--spring),opacity .24s ease;}
  .scrim.open .sheet{transform:none;opacity:1;}
  .sheet-grab{display:none;}
  .sheet-head{padding-top:14px;}
  .sheet-foot{padding-bottom:14px;}
}

/* ---------- TOAST ---------- */
.toasts{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
@media(min-width:1000px){ .toasts{bottom:24px;} }
.toast{
  display:flex;align-items:center;gap:9px;padding:11px 17px;border-radius:99px;max-width:min(94vw,420px);
  background:rgba(28,28,30,.92);color:#fff;font-size:14.5px;font-weight:550;letter-spacing:-.01em;
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:var(--shadow-3);
  animation:toastIn .4s var(--spring);
}
.toast .ic{width:18px;height:18px;flex:0 0 18px;}
.toast.ok .ic{color:#30D158;} .toast.err .ic{color:#FF453A;}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.94);}to{opacity:1;transform:none;}}

/* ---------- SCONTRINO ---------- */
.receipt{
  font-family:var(--mono);font-size:12.5px;line-height:1.62;background:#fff;color:#111;
  padding:18px 16px;border-radius:10px;max-width:340px;margin:0 auto;white-space:pre-wrap;
  box-shadow:var(--shadow-2);border:1px solid rgba(0,0,0,.08);
}
:root[data-theme="dark"] .receipt{box-shadow:var(--shadow-2);}

/* ---------- MISC ---------- */
.alertbox{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:13px;background:var(--orange-soft);color:var(--orange);}
.alertbox .ic{width:19px;height:19px;flex:0 0 19px;margin-top:1px;}
.alertbox b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.01em;}
.alertbox p{font-size:13.5px;opacity:.92;margin-top:1px;}
.stat-strip{display:flex;gap:0;background:var(--bg-2);border-radius:var(--r-card);box-shadow:var(--shadow-1);overflow:hidden;}
.stat-strip > div{flex:1;padding:14px 12px;text-align:center;border-right:1px solid var(--sep);min-width:0;}
.stat-strip > div:last-child{border-right:0;}
.stat-strip .v{font-size:19px;font-weight:700;letter-spacing:-.03em;}
.stat-strip .k{font-size:11.5px;color:var(--txt-2);font-weight:550;margin-top:2px;letter-spacing:-.005em;}
.progress{height:7px;border-radius:99px;background:var(--fill-1);overflow:hidden;}
.progress i{display:block;height:100%;border-radius:99px;transition:width .6s var(--spring);}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:520px;}
table.tbl th{
  text-align:left;font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;
  color:var(--txt-2);padding:10px 14px;border-bottom:1px solid var(--sep);white-space:nowrap;
}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--sep);white-space:nowrap;letter-spacing:-.01em;}
table.tbl tr:last-child td{border-bottom:0;}
table.tbl td.r,table.tbl th.r{text-align:right;}
.fab{
  position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:45;
  width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;
  box-shadow:0 8px 22px -6px rgba(0,122,255,.55),0 2px 6px rgba(0,0,0,.2);
  transition:transform .16s var(--spring);
}
.fab:active{transform:scale(.9);}
.fab .ic{width:26px;height:26px;}
@media(min-width:1000px){ .fab{display:none;} }
.view{animation:viewIn .34s var(--spring);}
@keyframes viewIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.hidden{display:none !important;}

/* ---------- ICONE ---------- */
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;}
</style>

/* ---------- costruzione dello stato iniziale ---------- */
function buildSeed() {
  const products = SEED_PRODUCTS.map(([nome, categoria, prezzo, stock, min, barcode]) => ({
    id: uid("p"), nome, categoria, prezzo,
    aggio: catById(categoria).aggio,
    stock, min, barcode, attivo: true
  }));
  const suppliers = SEED_SUPPLIERS.map(([nome, referente, telefono, email, note]) => ({ id: uid("f"), nome, referente, telefono, email, note }));
  const customers = SEED_CUSTOMERS.map(([nome, telefono, punti, sospeso, note]) => ({ id: uid("c"), nome, telefono, email: "", punti, sospeso, note }));

  /* pesi di vendita: le sigarette sono la stragrande maggioranza degli scontrini */
  const pool = [];
  products.forEach((p) => {
    const w = { sigarette: 26, gratta: 14, accessori: 9, trinciati: 5, sigari: 6,
                varie: 6, valori: 3, ricariche: 3, svapo: 2, servizi: 2 }[p.categoria] || 2;
    for (let i = 0; i < w; i++) pool.push(p);
  });

  const sales = [], movements = [], cash = [], closures = [];
  const now = new Date();
  let counter = 1;

  for (let d = 20; d >= 0; d--) {
    const day = new Date(now); day.setDate(now.getDate() - d);
    const dow = day.getDay();                       // 0 = domenica
    if (dow === 0) continue;                        // chiuso la domenica
    const base = dow === 6 ? 46 : dow === 5 ? 40 : 33;
    const nSales = d === 0 ? Math.max(6, Math.round(base * (now.getHours() - 7) / 12)) : rint(base - 9, base + 9);
    let dayTot = 0;

    for (let i = 0; i < nSales; i++) {
      const h = d === 0 ? rint(7, Math.max(8, now.getHours())) : rint(7, 19);
      const ts = new Date(day); ts.setHours(h, rint(0, 59), rint(0, 59), 0);
      const nItems = rnd() < 0.58 ? 1 : rnd() < 0.82 ? 2 : rnd() < 0.94 ? 3 : 4;
      const items = [], seen = {};
      for (let k = 0; k < nItems; k++) {
        const p = pick(pool);
        if (seen[p.id]) continue;
        seen[p.id] = 1;
        const qty = p.categoria === "sigarette" && rnd() < 0.14 ? rint(2, 5) : rnd() < 0.12 ? 2 : 1;
        items.push({ productId: p.id, nome: p.nome, categoria: p.categoria, qty, prezzo: p.prezzo, aggio: p.aggio });
      }
      if (!items.length) continue;
      const totale = items.reduce((s, it) => s + it.qty * it.prezzo, 0);
      const aggio = items.reduce((s, it) => s + it.qty * it.prezzo * it.aggio / 100, 0);
      const r = rnd();
      sales.push({
        id: uid("s"), num: counter++, ts: ts.getTime(), items,
        totale: +totale.toFixed(2), aggio: +aggio.toFixed(2), sconto: 0,
        pagamento: r < 0.55 ? "contanti" : r < 0.93 ? "carta" : "satispay",
        clienteId: null
      });
      dayTot += totale;
    }

    if (d > 0) {
      const diff = rnd() < 0.72 ? 0 : +((rnd() - 0.5) * 9).toFixed(2);
      closures.push({
        id: uid("z"), data: dayKey(day), atteso: +dayTot.toFixed(2),
        contati: +(dayTot + diff).toFixed(2), differenza: diff,
        note: diff === 0 ? "Quadratura corretta" : diff > 0 ? "Eccedenza in cassa" : "Ammanco da verificare"
      });
    }
    if (d % 5 === 2) {
      cash.push({ id: uid("m"), ts: new Date(day).setHours(9, 15), tipo: "uscita", importo: +(rint(120, 780) + 0.4).toFixed(2), causale: "Fornitura Logista", note: "Bolla di consegna" });
    }
    if (d % 7 === 3) {
      cash.push({ id: uid("m"), ts: new Date(day).setHours(17, 40), tipo: "uscita", importo: 250, causale: "Versamento in banca", note: "" });
    }
  }
  sales.sort((a, b) => a.ts - b.ts);

  products.slice(0, 22).forEach((p, i) => {
    const t = new Date(now); t.setDate(now.getDate() - ((i % 6) + 1)); t.setHours(8, 30);
    movements.push({ id: uid("mv"), ts: t.getTime(), productId: p.id, nome: p.nome, tipo: "carico", qty: rint(10, 60), note: "Consegna fornitore" });
  });
  movements.sort((a, b) => b.ts - a.ts);

  const grattaNomi = [
    ["Turista per Sempre", 5, 50], ["Il Miliardario Mega", 10, 30], ["Doppia Sfida", 2, 100],
    ["Numerissimi", 3, 50], ["Nuovo 20X", 20, 25], ["Battaglia Navale", 1, 100],
    ["Il Milionario Extra", 5, 50], ["Portafortuna", 2, 100], ["Super Cruciverba", 5, 50]
  ];
  const gratta = grattaNomi.map(([nome, taglio, pezzi], i) => {
    const venduti = i < 6 ? rint(Math.round(pezzi * 0.25), pezzi - 2) : 0;
    const dc = new Date(now); dc.setDate(now.getDate() - rint(1, 18));
    return { id: uid("g"), nome, taglio, pezzi, venduti, serie: "S" + rint(1000, 9999) + "-" + rint(10, 99),
             dataCarico: dc.getTime(), stato: i < 6 ? "aperta" : "magazzino" };
  });

  return {
    meta: { version: 1, createdAt: Date.now() },
    shop: {
      nome: "Tabaccheria Antonio", titolare: "Antonio Esposito", numeroRivendita: "42",
      indirizzo: "Via Emilia Centro 118", citta: "42121 Reggio Emilia (RE)",
      piva: "02214470351", telefono: "0522 445 118"
    },
    settings: { tema: "auto", aggioTabacchi: 10, aggioGratta: 8, scortaMinima: 10, puntiPerEuro: 1, stampaAuto: true },
    products, suppliers, customers, sales, movements, cash, closures, gratta, orders: []
  };
}

/* ============================================================
   3. CALCOLI E STATISTICHE
   ============================================================ */
const todayKey = () => dayKey(new Date());
const salesOf = (k) => S.sales.filter((s) => dayKey(s.ts) === k);
const sum = (arr, f) => arr.reduce((a, b) => a + f(b), 0);

function statsFor(list) {
  const inc = sum(list, (s) => s.totale);
  const agg = sum(list, (s) => s.aggio);
  return { incasso: inc, aggio: agg, scontrini: list.length, medio: list.length ? inc / list.length : 0 };
}
function lastDays(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = dayKey(d), l = salesOf(k);
    out.push({ date: d, key: k, ...statsFor(l) });
  }
  return out;
}
function byCategory(list) {
  const m = {};
  list.forEach((s) => s.items.forEach((it) => {
    const c = it.categoria || "varie";
    if (!m[c]) m[c] = { incasso: 0, aggio: 0, pezzi: 0 };
    m[c].incasso += it.qty * it.prezzo;
    m[c].aggio += it.qty * it.prezzo * it.aggio / 100;
    m[c].pezzi += it.qty;
  }));
  return Object.entries(m).map(([id, v]) => ({ id, cat: catById(id), ...v })).sort((a, b) => b.incasso - a.incasso);
}
function topProducts(list, n) {
  const m = {};
  list.forEach((s) => s.items.forEach((it) => {
    if (!m[it.productId]) m[it.productId] = { nome: it.nome, categoria: it.categoria, qty: 0, tot: 0 };
    m[it.productId].qty += it.qty;
    m[it.productId].tot += it.qty * it.prezzo;
  }));
  return Object.values(m).sort((a, b) => b.qty - a.qty).slice(0, n);
}
const lowStock = () => S.products.filter((p) => p.attivo && p.min > 0 && p.stock <= p.min).sort((a, b) => (a.stock - a.min) - (b.stock - b.min));
const cashToday = () => {
  const l = salesOf(todayKey()).filter((s) => s.pagamento === "contanti");
  const mov = S.cash.filter((m) => dayKey(m.ts) === todayKey());
  return sum(l, (s) => s.totale) + sum(mov.filter((m) => m.tipo === "entrata"), (m) => m.importo) - sum(mov.filter((m) => m.tipo === "uscita"), (m) => m.importo);
};
const stockValue = () => sum(S.products.filter((p) => p.stock < 900), (p) => p.stock * p.prezzo);

/* ---------- grafico a barre settimanale ---------- */
function weekChart(days) {
  const max = Math.max(1, ...days.map((d) => d.incasso));
  const tk = todayKey();
  let h = '<div class="wchart">';
  days.forEach((d) => {
    const isToday = d.key === tk;
    const isZero = d.incasso === 0;
    const hp = isZero ? 6 : Math.max(8, Math.round(d.incasso / max * 100));
    const lab = d.date.toLocaleDateString("it-IT", { weekday: "short" }).replace(".", "");
    h += '<div class="wcol' + (isToday ? " is-today" : "") + (isZero ? " is-zero" : "") + '" title="' +
         esc(fmtDate(d.date)) + " — " + esc(eur(d.incasso)) + '">' +
         '<div class="wval num">' + (isZero ? "—" : eurShort(d.incasso)) + "</div>" +
         '<div class="wbar" style="height:' + hp + '%"></div>' +
         '<div class="wlab">' + esc(lab) + "</div></div>";
  });
  return h + "</div>";
}
function catBars(cats, total, field) {
  if (!cats.length) return '<div class="empty">' + ic("i-chart") + "<b>Nessun dato</b><p>Le vendite registrate compariranno qui suddivise per reparto.</p></div>";
  let h = '<div class="bars">';
  cats.forEach((c) => {
    const v = c[field || "incasso"];
    const w = total > 0 ? Math.max(2, v / total * 100) : 0;
    h += '<div class="barline"><span class="nm">' + esc(c.cat.nome) + "</span>" +
         '<span class="track"><i class="fill" style="width:' + w.toFixed(1) + "%;background:" + c.cat.colore + '"></i></span>' +
         '<span class="vl num">' + eur(v) + "</span></div>";
  });
  return h + "</div>";
}

/* ============================================================
   8. SEZIONE — CASSA (punto vendita)
   ============================================================ */
let cart = [];
let payMethod = "contanti";
let posCat = "tutti";
let posQuery = "";
let posCliente = "";

const cartTotal = () => cart.reduce((s, i) => s + i.qty * i.prezzo, 0);
const cartAggio = () => cart.reduce((s, i) => s + i.qty * i.prezzo * i.aggio / 100, 0);
const cartPezzi = () => cart.reduce((s, i) => s + i.qty, 0);

function posFiltered() {
  const q = posQuery.toLowerCase().trim();
  return S.products.filter((p) => {
    if (!p.attivo) return false;
    if (posCat !== "tutti" && p.categoria !== posCat) return false;
    if (!q) return true;
    return p.nome.toLowerCase().includes(q) || (p.barcode || "").includes(q);
  });
}

function addToCart(p, qty) {
  const ex = cart.find((i) => i.productId === p.id);
  if (ex) ex.qty += qty || 1;
  else cart.push({ productId: p.id, nome: p.nome, categoria: p.categoria, qty: qty || 1, prezzo: p.prezzo, aggio: p.aggio });
  renderCart();
}
function setQty(idx, d) {
  cart[idx].qty += d;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  renderCart();
}

function renderGrid() {
  const el = $("#posGrid"); if (!el) return;
  const list = posFiltered();
  if (!list.length) {
    el.innerHTML = '<div class="empty" style="grid-column:1/-1">' + ic("i-search") +
      "<b>Nessun prodotto trovato</b><p>Prova con un altro nome, un codice a barre o cambia reparto.</p></div>";
    return;
  }
  el.innerHTML = list.map((p) => {
    const c = catById(p.categoria);
    const illim = p.stock >= 900;
    const out = !illim && p.stock <= 0;
    const low = !illim && !out && p.min > 0 && p.stock <= p.min;
    const st = illim ? "" : '<span class="st' + (out ? " out" : low ? " low" : "") + '">' + (out ? "esaurito" : p.stock) + "</span>";
    return '<button class="ptile" style="--tint:' + c.colore + '" data-add="' + p.id + '" data-out="' + (out ? 1 : 0) + '">' +
      st + '<span class="nm">' + esc(p.nome) + '</span><span class="ct">' + esc(c.nome) +
      '</span><span class="pr num">' + eur(p.prezzo) + "</span></button>";
  }).join("");
}

function renderCart() {
  const el = $("#cartPanel"); if (!el) return;
  const tot = cartTotal();
  let h = '<div class="cart-head"><h2>Scontrino</h2>' +
    (cart.length ? '<button class="btn-plain" data-act="svuota" style="color:var(--red);font-size:14px">Svuota</button>'
                 : '<span class="hint" style="font-size:13px;color:var(--txt-2)">vuoto</span>') + "</div>";

  h += '<div class="cart-items">';
  if (!cart.length) {
    h += '<div class="empty" style="padding:34px 20px">' + ic("i-pos") + "<b>Nessun articolo</b><p>Tocca un prodotto per aggiungerlo allo scontrino.</p></div>";
  } else {
    cart.forEach((i, idx) => {
      h += '<div class="citem"><div class="citem-main"><div class="nm">' + esc(i.nome) + "</div>" +
        '<div class="sb num">' + eur(i.prezzo) + " · aggio " + num(i.aggio, 0) + "%</div></div>" +
        '<div class="stepper"><button data-qty="' + idx + '" data-d="-1" aria-label="Riduci">' + ic("i-minus") + "</button>" +
        '<span class="q num">' + i.qty + "</span>" +
        '<button data-qty="' + idx + '" data-d="1" aria-label="Aumenta">' + ic("i-plus") + "</button></div>" +
        '<div class="amt num">' + eur(i.qty * i.prezzo) + "</div></div>";
    });
  }
  h += "</div>";

  h += '<div class="cart-foot">' +
    '<div class="tot-row"><span>' + cartPezzi() + (cartPezzi() === 1 ? " pezzo" : " pezzi") + "</span><b class=\"num\">" + eur(tot) + "</b></div>" +
    '<div class="tot-row"><span>Aggio stimato</span><b class="num" style="color:var(--green)">' + eur(cartAggio()) + "</b></div>" +
    '<div class="tot-row big"><span>Totale</span><b class="num">' + eur(tot) + "</b></div>";

  h += '<div class="paybtns">' +
    ['contanti|i-cash|Contanti', 'carta|i-card|Carta', 'satispay|i-phone|Satispay'].map((s) => {
      const [k, i2, l] = s.split("|");
      return '<button class="paybtn" data-pay="' + k + '" aria-pressed="' + (payMethod === k) + '">' + ic(i2) + "<span>" + l + "</span></button>";
    }).join("") + "</div>";

  h += '<button class="btn btn-green btn-lg btn-block" data-act="incassa"' + (cart.length ? "" : " disabled") + ">" +
    ic("i-check") + "Incassa " + eur(tot) + "</button>";
  h += '<div style="display:flex;gap:8px;margin-top:8px">' +
    '<button class="btn" style="flex:1" data-act="libero">' + ic("i-euro") + "Importo libero</button>" +
    '<button class="btn" style="flex:1" data-act="cliente">' + ic("i-users") + (posCliente ? "Cliente ✓" : "Cliente") + "</button></div>";
  h += "</div>";

  el.innerHTML = h;
  const btn = $("#cartCount"); if (btn) btn.textContent = cartPezzi();
}

VIEWS.cassa = function () {
  let h = '<div class="largetitle"><div><h1>Cassa</h1><div class="sub">' +
    esc(fmtDate(new Date(), { weekday: "long", day: "numeric", month: "long" })) +
    " · scontrino n. " + (S.sales.length ? S.sales[S.sales.length - 1].num + 1 : 1) + "</div></div></div>";

  h += '<div class="pos"><div><div class="pos-toolbar">' +
    '<label class="search">' + ic("i-search") +
    '<input id="posSearch" type="search" placeholder="Cerca prodotto o codice a barre…" autocomplete="off" value="' + esc(posQuery) + '">' +
    "</label></div>";

  h += '<div class="chips"><button class="chip" data-cat="tutti" aria-pressed="' + (posCat === "tutti") + '">Tutti</button>' +
    CATS.map((c) => '<button class="chip" data-cat="' + c.id + '" aria-pressed="' + (posCat === c.id) + '">' + esc(c.nome) + "</button>").join("") + "</div>";

  h += '<div class="pgrid" id="posGrid"></div></div>';
  h += '<div class="cart" id="cartPanel"></div></div>';

  return {
    title: "Cassa", html: h,
    after: () => {
      renderGrid(); renderCart();
      const inp = $("#posSearch");
      inp.addEventListener("input", (e) => { posQuery = e.target.value; renderGrid(); });
      inp.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const l = posFiltered();
        if (l.length === 1) { addToCart(l[0], 1); posQuery = ""; inp.value = ""; renderGrid(); toast(l[0].nome + " aggiunto"); }
        else if (l.length > 1) { addToCart(l[0], 1); toast(l[0].nome + " aggiunto"); }
      });
      if (window.matchMedia("(min-width:1000px)").matches) inp.focus();
    }
  };
};

/* ---------- incasso ---------- */
function apriIncasso() {
  if (!cart.length) return;
  const tot = cartTotal();
  const cli = S.customers.find((c) => c.id === posCliente);
  let h = '<div style="text-align:center;padding:6px 0 18px">' +
    '<div style="font-size:13px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-2)">Totale da incassare</div>' +
    '<div class="num" style="font-size:44px;font-weight:760;letter-spacing:-.045em;line-height:1.1">' + eur(tot) + "</div>" +
    '<div style="font-size:13.5px;color:var(--txt-2)">' + cartPezzi() + " pezzi · aggio " + eur(cartAggio()) + "</div></div>";

  h += '<div class="paybtns" style="margin-bottom:16px">' +
    ['contanti|i-cash|Contanti', 'carta|i-card|Carta', 'satispay|i-phone|Satispay'].map((s) => {
      const [k, i2, l] = s.split("|");
      return '<button class="paybtn" data-pay2="' + k + '" aria-pressed="' + (payMethod === k) + '">' + ic(i2) + "<span>" + l + "</span></button>";
    }).join("") + "</div>";

  h += '<div id="restoBox"' + (payMethod === "contanti" ? "" : ' class="hidden"') + ">" +
    '<label class="field"><span>Contanti ricevuti</span>' +
    '<input class="input num" name="ricevuto" type="text" inputmode="decimal" placeholder="' + num(tot, 2) + '"></label>' +
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 14px">' +
    [Math.ceil(tot), Math.ceil(tot / 5) * 5, Math.ceil(tot / 10) * 10, 20, 50].filter((v, i, a) => v >= tot && a.indexOf(v) === i).slice(0, 4)
      .map((v) => '<button class="btn" data-quick="' + v + '" style="padding:7px 13px;font-size:14px">' + eur(v) + "</button>").join("") +
    "</div>" +
    '<div id="restoOut" class="alertbox hidden" style="background:var(--green-soft);color:var(--green);margin-bottom:14px"></div></div>';

  if (cli) h += '<div class="pill pill-blue" style="margin-bottom:12px">' + ic("i-users") + esc(cli.nome) + "</div>";
  h += '<label class="field" style="display:flex;align-items:center;justify-content:space-between;gap:12px">' +
    "<span style=\"margin:0\">Mostra lo scontrino dopo l'incasso</span>" +
    '<button class="switch" id="swScontrino" role="switch" aria-checked="' + (S.settings.stampaAuto ? "true" : "false") + '"></button></label>';

  openSheet({
    title: "Incasso", okLabel: "Conferma", noFocus: true, body: h,
    onOk: () => { concludiVendita(); return true; }
  });

  const upd = () => {
    const r = numVal("ricevuto"), out = $("#restoOut");
    if (!out) return;
    if (r >= tot && r > 0) {
      out.classList.remove("hidden");
      out.innerHTML = ic("i-cash") + "<span><b>Resto " + eur(r - tot) + "</b><p>Ricevuti " + eur(r) + " su " + eur(tot) + "</p></span>";
    } else out.classList.add("hidden");
  };
  const body = $("#sheetBody");
  body.addEventListener("input", upd);
  body.addEventListener("click", (e) => {
    const q = e.target.closest("[data-quick]");
    if (q) { const f = $("#sheetBody [name=ricevuto]"); f.value = num(Number(q.dataset.quick), 2); upd(); }
    const p = e.target.closest("[data-pay2]");
    if (p) {
      payMethod = p.dataset.pay2;
      $$("[data-pay2]", body).forEach((b) => b.setAttribute("aria-pressed", b.dataset.pay2 === payMethod));
      $("#restoBox").classList.toggle("hidden", payMethod !== "contanti");
      renderCart();
    }
    const sw = e.target.closest("#swScontrino");
    if (sw) { const v = sw.getAttribute("aria-checked") !== "true"; sw.setAttribute("aria-checked", v); S.settings.stampaAuto = v; save(); }
  });
}

function concludiVendita() {
  const tot = cartTotal();
  const sale = {
    id: uid("s"), num: (S.sales.length ? S.sales[S.sales.length - 1].num : 0) + 1,
    ts: Date.now(), items: cart.map((i) => Object.assign({}, i)),
    totale: +tot.toFixed(2), aggio: +cartAggio().toFixed(2), sconto: 0,
    pagamento: payMethod, clienteId: posCliente || null
  };
  S.sales.push(sale);
  cart.forEach((i) => {
    const p = S.products.find((x) => x.id === i.productId);
    if (p && p.stock < 900) p.stock = Math.max(0, p.stock - i.qty);
    if (i.categoria === "gratta") {
      const g = S.gratta.find((x) => x.stato === "aperta" && x.taglio === i.prezzo && x.venduti < x.pezzi);
      if (g) g.venduti = Math.min(g.pezzi, g.venduti + i.qty);
    }
  });
  if (posCliente) {
    const c = S.customers.find((x) => x.id === posCliente);
    if (c) c.punti += Math.floor(tot * S.settings.puntiPerEuro);
  }
  save();
  const mostra = S.settings.stampaAuto;
  cart = []; posCliente = ""; posQuery = "";
  render();
  toast("Scontrino n. " + sale.num + " · " + eur(sale.totale));
  if (mostra) setTimeout(() => mostraScontrino(sale.id), 450);
}

function mostraScontrino(id) {
  const s = S.sales.find((x) => x.id === id); if (!s) return;
  const W = 32;
  const line = (l, r) => (l + " ".repeat(Math.max(1, W - l.length - r.length)) + r);
  let t = "";
  t += S.shop.nome.toUpperCase() + "\n" + S.shop.indirizzo + "\n" + S.shop.citta + "\n";
  t += "P.IVA " + S.shop.piva + "  Riv. n. " + S.shop.numeroRivendita + "\n";
  t += "-".repeat(W) + "\n";
  s.items.forEach((i) => {
    t += i.nome.slice(0, W) + "\n";
    t += line("  " + i.qty + " x " + num(i.prezzo, 2), num(i.qty * i.prezzo, 2)) + "\n";
  });
  t += "-".repeat(W) + "\n";
  t += line("TOTALE EURO", num(s.totale, 2)) + "\n";
  t += line("Pagamento " + s.pagamento, "") + "\n";
  t += line("di cui aggio", num(s.aggio, 2)) + "\n";
  t += "-".repeat(W) + "\n";
  t += "DOCUMENTO COMMERCIALE\ndi vendita o prestazione\n";

/* ============================================================
   9. SEZIONE — PRODOTTI
   ============================================================ */
let prodQuery = "", prodCat = "tutti", prodSort = "nome";

function prodFiltered() {
  const q = prodQuery.toLowerCase().trim();
  let l = S.products.filter((p) => {
    if (prodCat !== "tutti" && p.categoria !== prodCat) return false;
    if (!q) return true;
    return p.nome.toLowerCase().includes(q) || (p.barcode || "").includes(q);
  });
  const ord = { nome: (a, b) => a.nome.localeCompare(b.nome, "it"),
                prezzo: (a, b) => b.prezzo - a.prezzo,
                stock: (a, b) => a.stock - b.stock };
  return l.sort(ord[prodSort]);
}

function prodRows(list) {
  if (!list.length) return '<li><div class="empty">' + ic("i-bag") + "<b>Nessun prodotto</b><p>Cambia i filtri di ricerca oppure aggiungi un nuovo articolo al listino.</p></div></li>";
  return list.map((p) => {
    const c = catById(p.categoria);
    const illim = p.stock >= 900;
    const out = !illim && p.stock <= 0;
    const low = !illim && !out && p.min > 0 && p.stock <= p.min;
    const pill = illim ? '<span class="pill">servizio</span>'
      : out ? '<span class="pill pill-red">esaurito</span>'
      : low ? '<span class="pill pill-orange">' + p.stock + " pz</span>"
      : '<span class="pill pill-green">' + p.stock + " pz</span>";
    return '<li><button class="row" data-act="editprod" data-id="' + p.id + '">' +
      '<span class="avatar" style="background:' + c.colore + '">' + ic(c.icona) + "</span>" +
      '<span class="row-main"><span class="row-title">' + esc(p.nome) + '</span>' +
      '<span class="row-sub">' + esc(c.nome) + " · aggio " + num(p.aggio, 0) + "%" + (p.barcode ? " · " + esc(p.barcode) : "") + "</span></span>" +
      pill + '<span class="row-val num">' + eur(p.prezzo) + "</span>" + ic("i-right", "chev") + "</button></li>";
  }).join("");
}

    '<div><div class="v num" style="color:var(--orange)">' + num(low.length) + '</div><div class="k">Sotto scorta</div></div>' +
    '<div><div class="v num">' + num(CATS.length) + '</div><div class="k">Reparti</div></div>' +
    '<div><div class="v num">' + eurShort(stockValue()) + '</div><div class="k">Valore</div></div></div>';

  h += '<div class="pos-toolbar" style="margin-top:16px"><label class="search">' + ic("i-search") +
    '<input id="prodSearch" type="search" placeholder="Cerca per nome o codice…" autocomplete="off" value="' + esc(prodQuery) + '"></label>' +
    '<div class="seg" role="tablist">' +
    [["nome", "A–Z"], ["prezzo", "Prezzo"], ["stock", "Giacenza"]].map(([k, l]) =>

        $("#prodList").innerHTML = prodRows(prodFiltered());
      });
    }
  };

      const dati = { nome, categoria: val("categoria"), prezzo: numVal("prezzo"), aggio: numVal("aggio"),
                     stock: Math.round(numVal("stock")), min: Math.round(numVal("min")), barcode: val("barcode"), attivo: true };
      if (isNew) { S.products.push(Object.assign({ id: uid("p") }, dati)); toast("Prodotto aggiunto al listino"); }

    h += '<ul class="list">';

    low.forEach((p) => {
      const c = catById(p.categoria);

      h += '<li><div class="row"><span class="avatar" style="background:' + c.colore + '">' + ic(c.icona) + "</span>" +
        '<span class="row-main"><span class="row-title">' + esc(p.nome) + "</span>" +
        '<span class="row-sub">giacenza ' + p.stock + " · minimo " + p.min + " · riordinare ~" + manca + " pz</span></span>" +

    });

    h += '<ul class="list">';
    if (!S.movements.length) h += '<li><div class="empty">' + ic("i-box") + "<b>Nessun movimento</b><p>Carichi, scarichi e rettifiche compariranno in questo registro.</p></div></li>";
    S.movements.slice(0, 60).forEach((m) => {
      const pos = m.qty > 0;
      h += '<li><div class="row"><span class="avatar" style="background:' + (pos ? "var(--green)" : "var(--red)") + '">' + ic(pos ? "i-down" : "i-up") + "</span>" +
        '<span class="row-main"><span class="row-title">' + esc(m.nome) + "</span>" +
        '<span class="row-sub">' + esc(m.tipo) + " · " + fmtDate(m.ts) + " " + fmtTime(m.ts) + (m.note ? " · " + esc(m.note) : "") + "</span></span>" +
        '<span class="row-val num" style="color:' + (pos ? "var(--green)" : "var(--red)") + '">' + (pos ? "+" : "") + num(m.qty) + "</span></div></li>";
    });
    h += "</ul>";
  } else {
    h += '<div class="card"><div class="tablewrap"><table class="tbl"><thead><tr>' +
      "<th>Prodotto</th><th>Reparto</th><th class=\"r\">Giacenza</th><th class=\"r\">Minimo</th><th class=\"r\">Prezzo</th><th class=\"r\">Valore</th></tr></thead><tbody>";
    gestiti.slice().sort((a, b) => b.stock * b.prezzo - a.stock * a.prezzo).forEach((p) => {
      const c = catById(p.categoria);
      const alert2 = p.min > 0 && p.stock <= p.min;
      h += "<tr><td>" + esc(p.nome) + '</td><td><span class="pill" style="color:' + c.colore + '">' + esc(c.nome) + "</span></td>" +
        '<td class="r num"' + (alert2 ? ' style="color:var(--orange);font-weight:700"' : "") + ">" + num(p.stock) + "</td>" +
        '<td class="r num">' + num(p.min) + '</td><td class="r num">' + eur(p.prezzo) + '</td><td class="r num">' + eur(p.stock * p.prezzo) + "</td></tr>";
    });
    h += "</tbody></table></div></div>";
  }
  return { title: "Magazzino", html: h, actions: '<button class="btn btn-tint" data-act="carico">' + ic("i-down") + "Carico</button>" };
};

function formCarico(pid) {
  const opts = S.products.filter((p) => p.stock < 900).sort((a, b) => a.nome.localeCompare(b.nome, "it"));
  const h = '<label class="field"><span>Prodotto</span><select class="input" name="pid">' +
    opts.map((p) => '<option value="' + p.id + '"' + (pid === p.id ? " selected" : "") + ">" + esc(p.nome) + " — giacenza " + p.stock + "</option>").join("") + "</select></label>" +
    '<div class="field-row"><label class="field"><span>Tipo movimento</span><select class="input" name="tipo">' +
    '<option value="carico">Carico da fornitore</option><option value="scarico">Scarico / reso</option><option value="rettifica">Rettifica inventario</option></select></label>' +
    '<label class="field"><span>Quantità</span><input class="input num" name="qty" inputmode="numeric" value="10"></label></div>' +
    '<label class="field"><span>Note</span><input class="input" name="note" placeholder="es. bolla n. 1284 Logista"></label>';
  openSheet({
    title: "Movimento di magazzino", okLabel: "Registra", body: h,
    onOk: () => {
      const p = S.products.find((x) => x.id === val("pid"));
      const tipo = val("tipo");
      let q = Math.round(numVal("qty"));
      if (!p || !q) { toast("Indica una quantità valida", "err"); return false; }
      if (tipo === "scarico") q = -Math.abs(q);
      if (tipo === "rettifica") q = Math.round(numVal("qty")) - p.stock;
      p.stock = Math.max(0, p.stock + q);
      S.movements.unshift({ id: uid("mv"), ts: Date.now(), productId: p.id, nome: p.nome, tipo, qty: q, note: val("note") });
      save(); render();
      toast(p.nome + " · giacenza " + p.stock);
      return true;
    }
  });
}

  aperte.forEach((g) => {
    const rest = g.pezzi - g.venduti;

      '<span class="progress" style="width:100%"><i style="width:' + p.toFixed(0) + "%;background:" + col + '"></i></span>' +

let repPeriod = 7;

function periodSales(n) {
  if (n === 0) return salesOf(todayKey());
  const from = new Date(); from.setDate(from.getDate() - (n - 1)); from.setHours(0, 0, 0, 0);
  return S.sales.filter((s) => s.ts >= from.getTime());
}

VIEWS.report = function () {
  const list = periodSales(repPeriod);
  const st = statsFor(list);
  const days = lastDays(repPeriod === 0 ? 1 : repPeriod);
  const cats = byCategory(list);
  const top = topProducts(list, 10);
  const pag = { contanti: 0, carta: 0, satispay: 0 };
  list.forEach((s) => { pag[s.pagamento] = (pag[s.pagamento] || 0) + s.totale; });
  const gg = days.filter((d) => d.incasso > 0).length || 1;

  let h = '<div class="largetitle"><div><h1>Report</h1><div class="sub">Andamento delle vendite e dell\'aggio maturato</div></div>' +
    '<button class="btn btn-tint" data-act="export">' + ic("i-share") + "Esporta CSV</button></div>";

  h += '<div class="seg" role="tablist" style="margin-bottom:16px">' +
    [[0, "Oggi"], [7, "7 giorni"], [14, "14 giorni"], [30, "30 giorni"]].map(([k, l]) =>
      '<button role="tab" data-rep="' + k + '" aria-selected="' + (repPeriod === k) + '">' + l + "</button>").join("") + "</div>";

  const kpi = (colore, icona, etichetta, valore, piede) =>
    '<div class="kpi"><div class="kpi-top"><span class="kpi-ic" style="background:' + colore + '">' + ic(icona) + "</span>" +
    "<span>" + etichetta + '</span></div><div class="kpi-val num">' + valore + '</div><div class="kpi-foot">' + piede + "</div></div>";

  h += '<div class="kpis">' +
    kpi("var(--green)", "i-euro", "Incasso", eur(st.incasso), "media " + eur(st.incasso / gg) + " al giorno") +
    kpi("var(--orange)", "i-tag", "Aggio", eur(st.aggio), st.incasso ? pct(st.aggio / st.incasso * 100) + " sul venduto" : "—") +
    kpi("var(--blue)", "i-pos", "Scontrini", num(st.scontrini), num(st.scontrini / gg, 1) + " al giorno") +
    kpi("var(--indigo)", "i-cash", "Scontrino medio", eur(st.medio), num(sum(list, (s) => s.items.reduce((a, i) => a + i.qty, 0)) / (st.scontrini || 1), 1) + " pezzi") +
    "</div>";

  h += '<div class="section-label">Incasso giornaliero</div><div class="card">' + weekChart(days) +
    '<div class="chart-legend" style="padding-top:14px"><span class="leg">Migliore <b class="num">' +
    eur(Math.max(0, ...days.map((d) => d.incasso))) + "</b></span>" +
    '<span class="leg">Media <b class="num">' + eur(st.incasso / gg) + "</b></span>" +
    '<span class="leg">Giorni di apertura <b class="num">' + gg + "</b></span></div></div>";

  h += '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px">';
  h += '<div class="card"><div class="card-head"><h2>Incasso per reparto</h2></div>' + catBars(cats, st.incasso) + "</div>";
  h += '<div class="card"><div class="card-head"><h2>Aggio per reparto</h2><span class="hint">' + eur(st.aggio) + "</span></div>" +
    catBars(cats.slice().sort((a, b) => b.aggio - a.aggio), st.aggio, "aggio") + "</div>";
  h += "</div>";

  h += '<div class="section-label">Modalità di pagamento</div><div class="card"><div class="bars" style="padding-top:16px">' +
    [["contanti", "Contanti", "var(--green)"], ["carta", "Carta", "var(--blue)"], ["satispay", "Satispay", "var(--purple)"]].map(([k, l, c]) => {
      const w = st.incasso ? pag[k] / st.incasso * 100 : 0;
      return '<div class="barline"><span class="nm">' + l + '</span><span class="track"><i class="fill" style="width:' +
        Math.max(1, w).toFixed(1) + "%;background:" + c + '"></i></span><span class="vl num">' + eur(pag[k] || 0) + "</span></div>";
    }).join("") + "</div></div>";

  h += '<div class="section-label">Prodotti più venduti</div><div class="card"><div class="tablewrap"><table class="tbl"><thead><tr>' +
    '<th>#</th><th>Prodotto</th><th>Reparto</th><th class="r">Pezzi</th><th class="r">Incasso</th></tr></thead><tbody>';
  if (!top.length) h += '<tr><td colspan="5" style="text-align:center;color:var(--txt-2);padding:26px">Nessuna vendita nel periodo selezionato</td></tr>';
  top.forEach((p, i) => {
    h += "<tr><td>" + (i + 1) + "</td><td>" + esc(p.nome) + '</td><td><span class="pill" style="color:' + catById(p.categoria).colore + '">' +
      esc(catById(p.categoria).nome) + '</span></td><td class="r num">' + num(p.qty) + '</td><td class="r num">' + eur(p.tot) + "</td></tr>";
  });
  h += "</tbody></table></div></div>";

  return { title: "Report", html: h, actions: '<button class="btn btn-tint" data-act="export">' + ic("i-share") + "CSV</button>" };
};

function esportaCSV() {
  const list = periodSales(repPeriod);
  const righe = [["Numero", "Data", "Ora", "Articoli", "Totale", "Aggio", "Pagamento"].join(";")];
  list.forEach((s) => righe.push([
    s.num, fmtDate(s.ts, { day: "2-digit", month: "2-digit", year: "numeric" }), fmtTime(s.ts),
    '"' + s.items.map((i) => i.qty + "x " + i.nome).join(", ").replace(/"/g, "'") + '"',
    num(s.totale, 2), num(s.aggio, 2), s.pagamento
  ].join(";")));
  const csv = righe.join("\n");
  openSheet({
    title: "Esporta vendite", ok: false, cancelLabel: "Chiudi", noFocus: true,
    body: '<p style="font-size:14px;color:var(--txt-2);margin-bottom:12px;line-height:1.5">' +
      num(list.length) + " scontrini nel periodo selezionato. Copia il testo e incollalo in un foglio di calcolo: le colonne sono separate da punto e virgola.</p>" +
      '<textarea class="input" id="csvBox" rows="9" readonly style="font-family:var(--mono);font-size:12px">' + esc(csv) + "</textarea>" +
      '<button class="btn btn-primary btn-block" data-act="copia" data-target="csvBox" style="margin-top:12px">' + ic("i-share") + "Copia negli appunti</button>"
  });
}

VIEWS.primanota = function () {
  const tk = todayKey();
  const oggi = salesOf(tk);
  const contanti = sum(oggi.filter((s) => s.pagamento === "contanti"), (s) => s.totale);
  const elettronico = sum(oggi.filter((s) => s.pagamento !== "contanti"), (s) => s.totale);
  const mov = S.cash.filter((m) => dayKey(m.ts) === tk);
  const entrate = sum(mov.filter((m) => m.tipo === "entrata"), (m) => m.importo);
  const uscite = sum(mov.filter((m) => m.tipo === "uscita"), (m) => m.importo);
  const saldo = contanti + entrate - uscite;
  const chiusa = S.closures.find((c) => c.data === tk);

  let h = '<div class="largetitle"><div><h1>Prima nota</h1><div class="sub">Movimenti di cassa e chiusura giornaliera</div></div>' +
    '<button class="btn btn-primary" data-act="newmov">' + ic("i-plus") + "Movimento</button></div>";

  h += '<div class="card card-pad" style="margin-bottom:14px">' +
    '<div class="tot-row"><span>Vendite in contanti</span><b class="num">' + eur(contanti) + "</b></div>" +
    '<div class="tot-row"><span>Vendite elettroniche</span><b class="num" style="color:var(--txt-2)">' + eur(elettronico) + "</b></div>" +
    '<div class="tot-row"><span>Altre entrate</span><b class="num" style="color:var(--green)">+ ' + eur(entrate) + "</b></div>" +
    '<div class="tot-row"><span>Uscite</span><b class="num" style="color:var(--red)">− ' + eur(uscite) + "</b></div>" +
    '<div class="tot-row big" style="border-top:1px solid var(--sep);margin-top:8px;padding-top:12px"><span>Contanti attesi in cassa</span><b class="num">' + eur(saldo) + "</b></div>" +
    (chiusa
      ? '<div class="alertbox" style="background:var(--green-soft);color:var(--green);margin-top:6px">' + ic("i-check") +
        "<span><b>Cassa già chiusa</b><p>Contati " + eur(chiusa.contati) + " · differenza " + eur(chiusa.differenza) + "</p></span></div>"
      : '<button class="btn btn-green btn-block btn-lg" data-act="chiusura" style="margin-top:10px">' + ic("i-check") + "Chiusura di cassa</button>");
  h += "</div>";

  h += '<div class="section-label">Movimenti recenti</div><ul class="list">';
  const recenti = S.cash.slice().sort((a, b) => b.ts - a.ts).slice(0, 25);
  if (!recenti.length) h += '<li><div class="empty">' + ic("i-book") + "<b>Nessun movimento</b><p>Registra qui i prelievi, i versamenti e le spese di cassa.</p></div></li>";
  recenti.forEach((m) => {
    const e = m.tipo === "entrata";
    h += '<li><button class="row" data-act="delmov" data-id="' + m.id + '">' +
      '<span class="avatar" style="background:' + (e ? "var(--green)" : "var(--red)") + '">' + ic(e ? "i-down" : "i-up") + "</span>" +
      '<span class="row-main"><span class="row-title">' + esc(m.causale) + "</span>" +
      '<span class="row-sub">' + fmtDate(m.ts) + " " + fmtTime(m.ts) + (m.note ? " · " + esc(m.note) : "") + "</span></span>" +
      '<span class="row-val num" style="color:' + (e ? "var(--green)" : "var(--red)") + '">' + (e ? "+ " : "− ") + eur(m.importo) + "</span></button></li>";
  });
  h += "</ul>";

  h += '<div class="section-label">Chiusure precedenti</div><div class="card"><div class="tablewrap"><table class="tbl"><thead><tr>' +
    '<th>Data</th><th class="r">Atteso</th><th class="r">Contato</th><th class="r">Differenza</th><th>Nota</th></tr></thead><tbody>';
  const ch = S.closures.slice().sort((a, b) => b.data.localeCompare(a.data)).slice(0, 14);
  if (!ch.length) h += '<tr><td colspan="5" style="text-align:center;color:var(--txt-2);padding:26px">Nessuna chiusura registrata</td></tr>';

    const col = c.differenza === 0 ? "var(--green)" : c.differenza > 0 ? "var(--blue)" : "var(--red)";
    h += "<tr><td>" + fmtDate(c.data + "T12:00:00") + '</td><td class="r num">' + eur(c.atteso) + '</td><td class="r num">' + eur(c.contati) +
      '</td><td class="r num" style="color:' + col + ';font-weight:650">' + (c.differenza > 0 ? "+" : "") + eur(c.differenza) + "</td><td>" + esc(c.note) + "</td></tr>";
  });
  h += "</tbody></table></div></div>";

  return { title: "Prima nota", html: h, fab: "newmov", actions: '<button class="btn btn-tint" data-act="newmov">' + ic("i-plus") + "Movimento</button>" };

  const st = statsFor(salesOf(tk));
  const h = '<div class="stat-strip" style="margin-bottom:16px"><div><div class="v num">' + eur(st.incasso) + '</div><div class="k">Incasso</div></div>' +

function applyTheme() {
  const t = S.settings.tema;
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

function backupJSON() {
  openSheet({
    title: "Backup dei dati", ok: false, cancelLabel: "Chiudi", noFocus: true,
    body: '<p style="font-size:14px;color:var(--txt-2);margin-bottom:12px;line-height:1.5">Copia questo testo e conservalo: contiene listino, vendite, clienti e movimenti.</p>' +
      '<textarea class="input" id="bkBox" rows="8" readonly style="font-family:var(--mono);font-size:11px">' + esc(JSON.stringify(S)) + "</textarea>" +
      '<button class="btn btn-primary btn-block" data-act="copia" data-target="bkBox" style="margin-top:12px">' + ic("i-share") + "Copia negli appunti</button>"
  });
}
function ripristinaJSON() {
  openSheet({
    title: "Ripristina backup", okLabel: "Ripristina", danger: true,
    body: '<p style="font-size:14px;color:var(--txt-2);margin-bottom:12px;line-height:1.5">Incolla qui il backup. I dati attuali verranno sostituiti.</p>' +
      '<textarea class="input" name="json" rows="8" placeholder="{ … }" style="font-family:var(--mono);font-size:11px"></textarea>',
    onOk: () => {
      try {
        const d = JSON.parse(val("json"));
        if (!d || !d.products) throw new Error("formato");
        S = d; save(); applyTheme(); render();
        toast("Backup ripristinato");
        return true;
      } catch (e) { toast("Il testo incollato non è un backup valido", "err"); return false; }
    }
  });
}
function copiaTesto(id) {
  const el = document.getElementById(id); if (!el) return;
  el.select(); el.setSelectionRange(0, 999999);
  const done = () => toast("Copiato negli appunti");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(el.value).then(done, () => { try { document.execCommand("copy"); done(); } catch (e) { toast("Copia manualmente il testo", "err"); } });
  } else { try { document.execCommand("copy"); done(); } catch (e) { toast("Copia manualmente il testo", "err"); } }
}

/* ============================================================
   17. GESTIONE EVENTI
   ============================================================ */
const P = (id, arr) => (arr || S.products).find((x) => x.id === id);

document.addEventListener("click", (e) => {
  const t = e.target;

  const goEl = t.closest("[data-go]");
  if (goEl) { if (goEl.dataset.close) closeSheet(); go(goEl.dataset.go); return; }

  const add = t.closest("[data-add]");
  if (add) { const p = P(add.dataset.add); if (p) { addToCart(p, 1); } return; }

  const q = t.closest("[data-qty]");
  if (q) { setQty(+q.dataset.qty, +q.dataset.d); return; }

  const pay = t.closest("[data-pay]");
  if (pay) { payMethod = pay.dataset.pay; renderCart(); return; }

  const cat = t.closest("[data-cat]");
  if (cat) { posCat = cat.dataset.cat; $$("[data-cat]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.cat === posCat)); renderGrid(); return; }

  const pcat = t.closest("[data-pcat]");
  if (pcat) { prodCat = pcat.dataset.pcat; render(); return; }

  const srt = t.closest("[data-sort]");
  if (srt) { prodSort = srt.dataset.sort; render(); return; }

  const mg = t.closest("[data-mag]");
  if (mg) { magTab = mg.dataset.mag; render(); return; }

  const rp = t.closest("[data-rep]");
  if (rp) { repPeriod = +rp.dataset.rep; render(); return; }

  const tema = t.closest("[data-tema]");
  if (tema) { S.settings.tema = tema.dataset.tema; save(); applyTheme(); render(); return; }

  const sw = t.closest("[data-sw]");
  if (sw) { const v = sw.getAttribute("aria-checked") !== "true"; sw.setAttribute("aria-checked", v); S.settings[sw.dataset.sw] = v; save(); return; }

  const sc = t.closest("[data-setcli]");
  if (sc) { posCliente = sc.dataset.setcli; closeSheet(); renderCart(); toast(posCliente ? "Cliente associato" : "Cliente rimosso"); return; }

  const a = t.closest("[data-act]");
  if (!a) return;
  const id = a.dataset.id;

  switch (a.dataset.act) {
    case "altro": openAltro(); break;
    case "scontrino": mostraScontrino(id); break;
    case "svuota": cart = []; posCliente = ""; renderCart(); break;
    case "incassa": apriIncasso(); break;
    case "libero": formLibero(); break;
    case "cliente": scegliCliente(); break;
    case "stampa": window.print(); break;

    case "storna":
      confirmSheet("Stornare lo scontrino?", "Le quantità rientreranno in giacenza e l'incasso verrà rimosso dai report.", "Storna", () => {
        const s = S.sales.find((x) => x.id === id); if (!s) return;
        s.items.forEach((i) => { const p = P(i.productId); if (p && p.stock < 900) p.stock += i.qty; });
        S.sales = S.sales.filter((x) => x.id !== id);
        save(); render(); toast("Scontrino stornato");
      });
      break;

    case "newprod": formProdotto(null); break;
    case "editprod": formProdotto(P(id)); break;
    case "delprod":
      confirmSheet("Eliminare il prodotto?", "L'articolo sparisce dal listino e dalla cassa. Lo storico delle vendite resta invariato.", "Elimina", () => {
        S.products = S.products.filter((x) => x.id !== id);
        save(); render(); toast("Prodotto eliminato");
      });
      break;

    case "carico": formCarico(null); break;
    case "caricoq": formCarico(id); break;

    case "newmazz": formMazzetta(); break;
    case "mazz": dettaglioMazzetta(id); break;
    case "apri-mazz": {
      const g = S.gratta.find((x) => x.id === id);
      if (g) { g.stato = "aperta"; g.dataCarico = Date.now(); save(); render(); toast("Mazzetta in vendita"); }
      break;
    }
    case "vendi-mazz": {
      const g = S.gratta.find((x) => x.id === id); if (!g) break;
      const n = Math.max(1, Math.round(numVal("venduti")));
      g.venduti = Math.min(g.pezzi, g.venduti + n);
      const p = S.products.find((x) => x.categoria === "gratta" && x.prezzo === g.taglio);
      const item = { productId: p ? p.id : uid("x"), nome: "Gratta e Vinci " + eur(g.taglio), categoria: "gratta", qty: n, prezzo: g.taglio, aggio: S.settings.aggioGratta };
      S.sales.push({ id: uid("s"), num: (S.sales.length ? S.sales[S.sales.length - 1].num : 0) + 1, ts: Date.now(),
        items: [item], totale: +(n * g.taglio).toFixed(2), aggio: +(n * g.taglio * S.settings.aggioGratta / 100).toFixed(2),
        sconto: 0, pagamento: "contanti", clienteId: null });
      if (g.venduti >= g.pezzi) { g.stato = "chiusa"; }
      save(); closeSheet(); render();
      toast(n + (n === 1 ? " biglietto venduto · " : " biglietti venduti · ") + eur(n * g.taglio));
      break;
    }
    case "chiudi-mazz":
      confirmSheet("Chiudere la mazzetta?", "I biglietti residui vengono resi al concessionario e la mazzetta esce dalla vendita.", "Chiudi", () => {
        const g = S.gratta.find((x) => x.id === id);
        if (g) { g.stato = "chiusa"; save(); render(); toast("Mazzetta chiusa"); }
      });
      break;

    case "newcli": formCliente(null); break;
    case "cli": dettaglioCliente(id); break;
    case "editcli": closeSheet(); setTimeout(() => formCliente(S.customers.find((x) => x.id === id)), 420); break;
    case "delcli":
      confirmSheet("Eliminare il cliente?", "La scheda e i punti fedeltà verranno cancellati definitivamente.", "Elimina", () => {
        S.customers = S.customers.filter((x) => x.id !== id);
        save(); render(); toast("Cliente eliminato");
      });
      break;
    case "saldacli": {
      const c = S.customers.find((x) => x.id === id); if (!c) break;
      S.cash.push({ id: uid("m"), ts: Date.now(), tipo: "entrata", importo: c.sospeso, causale: "Saldo conto " + c.nome, note: "" });
      toast("Incassati " + eur(c.sospeso) + " da " + c.nome);
      c.sospeso = 0; save(); closeSheet(); render();
      break;
    }

    case "newforn": formFornitore(null); break;
    case "editforn": formFornitore(S.suppliers.find((x) => x.id === id)); break;
    case "delforn":
      confirmSheet("Eliminare il fornitore?", "Il contatto verrà rimosso dalla rubrica.", "Elimina", () => {
        S.suppliers = S.suppliers.filter((x) => x.id !== id);
        save(); render(); toast("Fornitore eliminato");
      });
      break;

    case "newmov": formMovimento(); break;
    case "chiusura": formChiusura(); break;
    case "delmov":
      confirmSheet("Eliminare il movimento?", "La voce sparirà dalla prima nota e dal saldo di cassa.", "Elimina", () => {
        S.cash = S.cash.filter((x) => x.id !== id);
        save(); render(); toast("Movimento eliminato");
      });
      break;

    case "export": esportaCSV(); break;
    case "copia": copiaTesto(a.dataset.target); break;
    case "backup": backupJSON(); break;
    case "ripristina": ripristinaJSON(); break;
    case "demo":
      confirmSheet("Ricaricare i dati dimostrativi?", "Tutto il lavoro salvato verrà sostituito dal catalogo e dallo storico di esempio.", "Ricarica", () => {
        _seed = 20250825; S = buildSeed(); save(); applyTheme(); go("oggi"); toast("Dati dimostrativi ricaricati");
      });
      break;
    case "azzera":
      confirmSheet("Azzerare lo storico?", "Vendite, movimenti, prima nota e chiusure verranno cancellati. Listino, clienti e fornitori restano.", "Azzera", () => {
        S.sales = []; S.movements = []; S.cash = []; S.closures = [];
        save(); go("oggi"); toast("Storico azzerato");
      });
      break;
  }
});

/* impostazioni: salvataggio immediato dei campi */
document.addEventListener("input", (e) => {
  const sh = e.target.closest("[data-shop]");
  if (sh) { S.shop[sh.dataset.shop] = sh.value; save(); renderNav(); return; }
  const cf = e.target.closest("[data-cfg]");
  if (cf) { S.settings[cf.dataset.cfg] = Number(cf.value.replace(",", ".")) || 0; save(); }
});

/* ---------- foglio modale ---------- */
$("#sheetCancel").addEventListener("click", closeSheet);
$("#sheetOk").addEventListener("click", () => { if (!sheetOnOk || sheetOnOk() !== false) closeSheet(); });
$("#scrim").addEventListener("mousedown", (e) => { if (e.target.id === "scrim") closeSheet(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#scrim").hidden) { closeSheet(); return; }
  if (e.key === "Enter" && !$("#scrim").hidden && e.target.tagName === "INPUT") {
    e.preventDefault();
    if (!sheetOnOk || sheetOnOk() !== false) closeSheet();
    return;
  }
  if (e.key === "F2" || (e.key.toLowerCase() === "k" && (e.metaKey || e.ctrlKey))) { e.preventDefault(); go("cassa"); }
});

/* ---------- barra di navigazione al tocco dello scorrimento ---------- */
$("#scroller").addEventListener("scroll", () => {
  $("#navbar").classList.toggle("stuck", $("#scroller").scrollTop > 26);
}, { passive: true });

$("#fab").addEventListener("click", () => {
  const act = $("#fab").dataset.act;
  if (act === "newprod") formProdotto(null);
  else if (act === "newcli") formCliente(null);
  else if (act === "newforn") formFornitore(null);
  else if (act === "newmazz") formMazzetta();
  else if (act === "newmov") formMovimento();
});

/* ============================================================
   18. AVVIO
   ============================================================ */
S = load();
applyTheme();
const startRoute = (location.hash || "").replace("#", "");
if (VIEWS[startRoute]) route = startRoute;
render();
save();
window.addEventListener("hashchange", () => {
  const r = (location.hash || "").replace("#", "");
  if (VIEWS[r] && r !== route) { route = r; render(); }
});
